<div class="background">
    <div class="container">
        <div class="main-container">
            <div class="logo"><img src="/img/Small-Logo.png" alt="Logo"></div>
            <div class="main-txt">
                <h2>Welcome Back To Diva</h2>
                <p>Sign in to your Diva account and stay connected to your favorite pieces, exclusive drops, and
                    everything made for your everyday style.</p>
            </div>
            <div class="inputField">
                <label for="userEmail">Email Address</label>
                <div class="input">
                    <input type="email" name="userEmail" id="userEmail" placeholder="name@domain.com">
                    <span class="icons icon-email"></span>
                </div>
            </div>
            <div class="inputField">
                <label for="userPassword">Password</label>
                <div class="input">
                    <input type="password" name="userPassword" id="userPassword" placeholder="Your Password">
                    <span class="icons icon-eye"></span>
                </div>
            </div>
            <div class="check">
                <div class="remember">
                    <input type="checkbox" name="remember" id="remember">
                    <label for="remember">Remember Me</label>
                </div>
                <a routerLink="">Forgot Password</a>
            </div>
            <a class="signBtn" routerLink="">Sign In
                <span class="icons icon-forward"></span>
            </a>
            <p class="txt-separator">or Continue With</p>
            <div class="social-btn">
                <button class="social-account"><span class="icons icon-google"></span> Google</button>
                <button class="social-account"><span class="icons icon-Apple"></span> Apple</button>
            </div>
            <div class="new-user">
                <p>New to Diva? <a routerLink=""> Join the Inner Circle</a></p>
            </div>
        </div>
        <div class="info">
            <div class="lock">
                <span class="icons icon-lock"></span>END-TO-END ENCRYPTED
            </div>
            <div class="privacy">
                <span>PRIVACY</span>
                <span>CONCIERGE</span>
            </div>
        </div>
    </div>
</div>
